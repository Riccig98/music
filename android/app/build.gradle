plugins {
    id "com.android.application"
}

android {
    namespace "com.riccig98.chordlab"
    compileSdk 35

    defaultConfig {
        applicationId "com.riccig98.chordlab"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
