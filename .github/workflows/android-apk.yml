name: Build ChordLab Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChordLab.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordLab-Android
          path: ChordLab.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete chordlab-android --yes --cleanup-tag || true
          gh release create chordlab-android ChordLab.apk             --title "ChordLab Android"             --notes "APK Android di ChordLab. Installa ChordLab.apk sul telefono. Questa build carica automaticamente la versione più recente dell'app."
